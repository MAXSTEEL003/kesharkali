<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D372" />
      <stop offset="50%" stop-color="#C69A3B" />
      <stop offset="100%" stop-color="#9E7622" />
    </linearGradient>
    <linearGradient id="rubyGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1B1B" />
      <stop offset="100%" stop-color="#5E1010" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C69A3B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="44" height="44" rx="14" fill="url(#rubyGradIcon)" filter="url(#iconGlow)"/>
  <rect x="7" y="7" width="42" height="42" rx="13" stroke="url(#goldGradIcon)" stroke-width="1.5" fill="none" opacity="0.85"/>
  
  <!-- Central Golden Rice Grain with Keshar crown -->
  <path d="M28 16 C33 22, 33 32, 28 40 C23 32, 23 22, 28 16 Z" fill="url(#goldGradIcon)" />
  <!-- Left Stalk Grain -->
  <path d="M26 24 C20 24, 17 29, 20 33 C23 33, 26 29, 26 24 Z" fill="url(#goldGradIcon)" opacity="0.95" />
  <!-- Right Stalk Grain -->
  <path d="M30 24 C36 24, 39 29, 36 33 C33 33, 30 29, 30 24 Z" fill="url(#goldGradIcon)" opacity="0.95" />
  <!-- Top Keshar Pearl -->
  <circle cx="28" cy="15" r="2.2" fill="#F3D372" />
</svg>

