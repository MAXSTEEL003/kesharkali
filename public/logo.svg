<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D372" />
      <stop offset="50%" stop-color="#C69A3B" />
      <stop offset="100%" stop-color="#9E7622" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1B1B" />
      <stop offset="100%" stop-color="#5E1010" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#C69A3B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Badge -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#rubyGrad)" filter="url(#logoGlow)"/>
    <rect x="1" y="1" width="42" height="42" rx="11" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.85"/>
    
    <!-- Central Golden Rice Grain with Keshar crown -->
    <path d="M22 10 C27 16, 27 26, 22 34 C17 26, 17 16, 22 10 Z" fill="url(#goldGrad)" />
    <!-- Left Stalk Grain -->
    <path d="M20 18 C14 18, 11 23, 14 27 C17 27, 20 23, 20 18 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Right Stalk Grain -->
    <path d="M24 18 C30 18, 33 23, 30 27 C27 27, 24 23, 24 18 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Top Keshar Pearl -->
    <circle cx="22" cy="9" r="2" fill="#F3D372" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(62, 12)">
    <text x="0" y="21" font-family="'Space Grotesk', 'Cinzel', 'Montserrat', -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="1.5" fill="#8F1717">
      KESHAR <tspan fill="#C69A3B">KALI</tspan>
    </text>
    <text x="1" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="2" fill="#777777">
      PRECISION IN EVERY GRAIN
    </text>
  </g>
</svg>

